[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tkn-manictime-pipeline"
version = "0.4.1"
description = "Capture ManicTime SQLite databases and incrementally export CSV data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
tkn-manictime-pipeline = "manictime_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/manictime_pipeline"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
