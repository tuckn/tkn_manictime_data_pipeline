<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>ManicTime · PC利用レポート</title><style>
:root{font:16px/1.7 "Segoe UI","Yu Gothic UI",Meiryo,sans-serif;color:#192b40;background:#f4f6f8}
*{box-sizing:border-box}main{max-width:1040px;margin:60px auto;padding:0 24px}h1{font-size:34px;margin:8px 0}
.label{font-size:12px;letter-spacing:.16em;color:#56677b}.intro{color:#56677b;margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:20px}
.pc{display:block;background:#fff;border:1px solid #dbe2e9;border-radius:10px;padding:28px;text-decoration:none;color:inherit}
.pc:hover,.pc:focus-visible{border-color:#3d70b2;outline:2px solid #3d70b2;outline-offset:3px}

</style></head><body><main><div class="label">MANICTIME / ACTIVITY REPORT</div>
<h1>PCの利用記録</h1><p class="intro">アプリ・サイト・時間帯と、辞書で調べた語句を振り返るローカルレポートです。PCを選んで開きます。</p>
<div class="grid">__CARDS__</div><footer>当日分を除いた取得済みデータを集計しています。

<p>外部通信なし · HTML内で年／月／週を切り替え · <a href="report-manifest.json">生成条件・来歴</a></p>
</footer></main></body></html>
