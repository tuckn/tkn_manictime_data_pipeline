schema_version: "2.3.0"
default_profile: current-pc

# Parent folder for the latest ManicTime database copies (one generation per device).
raw_path: ~/.tkn/manictime_data_pipeline/data/raw
# Parent folder for extracted CSV data.
processed_data_path: ~/.tkn/manictime_data_pipeline/data/csv
# Human-facing, offline HTML reports and supporting CSVs. The command adds device subfolders.
report_path: ~/.tkn/manictime_data_pipeline/reports
report_timezone: Asia/Tokyo
report_lookup_gap_minutes: 30
# Run rules init once. These default paths normally need no overrides.
# application_rules_path: ~/.tkn/manictime_data_pipeline/rules/application_rules.csv
# site_rules_path: ~/.tkn/manictime_data_pipeline/rules/site_rules.csv
# extraction_rules_path: ~/.tkn/manictime_data_pipeline/rules/extraction_rules.yaml
# Durable checkpoints, provenance, run records and recovery files; not disposable cache.
# state_path defaults to ~/.tkn/manictime_data_pipeline/state
backup_timeout_seconds: 300
# Stop if total activity rows or any existing timeline loses more than this percent.
# Use 100 only when deliberately accepting a reduction, after reviewing a dry-run.
max_activity_drop_percent: 10

profiles:
  current-pc:
    # Used as the data subfolder name; must be unique across profiles.
    device_id: Example Current PC
    # Either the ManicTime application folder (containing Data) or the DB folder.
    source_path: C:/path/to/ManicTime
    # Optional raw_path and processed_data_path overrides use the same parent-folder rule.
    # The CLI appends device_id once; do not include it in either parent path.
